<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>KHM SafeArea mobile demo</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <header class="safe-fixed-top"><strong>KHM SafeArea</strong></header>
    <main id="main-content" class="safe-all">
      <h1>Mobile viewport demo</h1>
      <p>Rotate the device, collapse browser chrome, install the PWA, and focus the composer.</p>
      <div class="spacer" aria-hidden="true"></div>
      <label for="message">Message</label>
      <input id="message" name="message" autocomplete="off" />
    </main>
    <nav class="safe-fixed-bottom" aria-label="Primary">
      <a href="#main-content">Home</a><a href="#message">Compose</a>
    </nav>
  </body>
</html>
